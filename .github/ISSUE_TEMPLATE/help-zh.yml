name: 安装或使用求助
description: 装不上、不知道下一步，或生成的简报不好用，都可以在这里反馈。
title: "[求助]: "
body:
  - type: markdown
    attributes:
      value: "请勿附上真实项目简报、私有配置、密钥或个人路径。可粘贴去掉敏感信息的报错。"
  - type: dropdown
    id: step
    attributes:
      label: 卡在哪一步？
      options:
        - 安装或运行 demo
        - 接入自己的项目
        - 更新 ai_context
        - 上传到 ChatGPT 后不好用
        - 其他
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 发生了什么？
      description: 简单说说你想做什么、实际看到什么；有报错可以脱敏后贴在这里。
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 系统和使用的 agent（选填）
      placeholder: "例如 Windows / macOS，Codex / Claude Code"
